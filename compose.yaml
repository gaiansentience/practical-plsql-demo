services:
  oracle-db:
    image: ${ORACLE_IMAGE:-gvenzl/oracle-free:latest}
    container_name: practical-plsql-db
    ports:
      - "${ORACLE_PORT:-1521}:1521"
    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:-ChangeMe_123}
      ORACLE_DATABASE: ${ORACLE_DATABASE:-FREEPDB1}
      APP_USER: ${APP_USER:-demo}
      APP_USER_PASSWORD: ${APP_USER_PASSWORD:-demo_123}
    volumes:
      - oracle-data:/opt/oracle/oradata
      # run once, when the database is first created
      - ./database/initdb:/container-entrypoint-initdb.d:ro
      # run on every container startup
      - ./database/startdb:/container-entrypoint-startdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 60s

volumes:
  oracle-data:
